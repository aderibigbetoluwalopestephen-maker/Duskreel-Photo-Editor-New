<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duskreel — Photo Editor</title>
<style>
:root{--black:#030303;--panel:#080808;--panel2:#0d0d0d;--line:#222;--gold:#ffd21c;--gold2:#ffae00;--gold3:#fff06a;--text:#f5f5f5;--muted:#969696;--danger:#ff5757}
*{box-sizing:border-box}html,body{margin:0;background:var(--black);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;height:100%;overflow:hidden}button,input{font:inherit}button{color:inherit}
.app{height:100dvh;display:grid;grid-template-rows:68px minmax(0,1fr) 106px;background:#030303}
.topbar{display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:#050505}
.brand{display:flex;align-items:center;gap:9px;min-width:190px}.brand img{width:43px;height:38px;object-fit:contain}.brand strong{font-size:22px;letter-spacing:-.5px}.divider{width:1px;height:28px;background:var(--line)}.back{border:0;background:transparent;color:#aaa;font-size:14px}.top-spacer{flex:1}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:#0c0c0c;cursor:pointer}.export{border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold3),var(--gold2));color:#111;font-weight:800;padding:12px 24px;cursor:pointer;box-shadow:0 8px 25px #000}
.workspace{min-height:0;display:grid;grid-template-columns:92px minmax(0,1fr) 330px}.tools{border-right:1px solid var(--line);background:#070707;padding:12px 9px;display:flex;flex-direction:column;gap:6px}
.tool{border:0;background:transparent;border-radius:10px;padding:10px 4px;color:#999;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px}.tool .ico{font-size:21px}.tool.active{background:#141414;color:#fff;box-shadow:inset 3px 0 var(--gold)}.tool.active .ico{color:var(--gold)}
.stage{min-width:0;min-height:0;padding:18px;background:#090909;display:flex;flex-direction:column;gap:12px}.compare{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane{min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;background:#050505;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.pane-label{position:absolute;top:12px;left:12px;z-index:2;padding:7px 11px;border-radius:8px;background:#181818e8;font-weight:700;font-size:12px}.photo{max-width:100%;max-height:100%;object-fit:contain;display:none}.empty{color:#666;text-align:center;padding:20px}.empty b{display:block;color:#aaa;margin-bottom:6px}
.stagebar{display:flex;justify-content:center;gap:6px}.zoom{background:#111;border:1px solid var(--line);border-radius:8px;padding:7px 13px;color:#bbb}
.panel{border-left:1px solid var(--line);background:#080808;padding:20px;overflow:auto}.panel h2{font-size:17px;margin:0 0 16px}.section{border-top:1px solid var(--line);padding:15px 0}.section:first-of-type{border-top:0;padding-top:0}.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#bbb;margin:11px 0 6px}.val{color:#fff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--gold)}
.upload{border:1px dashed #454545;border-radius:10px;padding:14px 12px;text-align:center;background:#0d0d0d;cursor:pointer}.upload:hover{border-color:var(--gold)}.upload img{width:68px;height:56px;object-fit:contain}.upload-title{font-weight:700;font-size:12px;margin-top:6px}.upload-sub{font-size:10px;color:#777;margin-top:3px}.hidden{display:none}.positions{display:grid;grid-template-columns:repeat(3,28px);gap:5px;margin-top:8px}.pos{width:28px;height:28px;border:1px solid #333;background:#111;border-radius:5px;cursor:pointer;position:relative}.pos:after{content:"";width:5px;height:5px;border-radius:50%;background:#777;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.pos.active{border-color:var(--gold)}.pos.active:after{background:var(--gold)}
.remove{margin-top:10px;width:100%;border:1px solid #333;background:#111;border-radius:8px;padding:9px;cursor:pointer;color:#ddd}.remove:hover{border-color:var(--danger)}.film{border-top:1px solid var(--line);background:#070707;padding:10px 18px;display:flex;gap:10px;align-items:center;overflow-x:auto}.thumb{width:84px;height:76px;flex:0 0 84px;border:1px solid #292929;border-radius:8px;overflow:hidden;background:#111;cursor:pointer;padding:0}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{border:2px solid var(--gold)}.add{width:84px;height:76px;flex:0 0 84px;border:1px dashed #444;background:#101010;border-radius:8px;font-size:25px;color:#aaa;cursor:pointer}
@media(max-width:900px){.workspace{grid-template-columns:76px minmax(0,1fr)}.panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:280px}.workspace{overflow:auto}.stage{min-height:55vh}.app{grid-template-rows:60px minmax(0,1fr) 86px}}
@media(max-width:700px){html,body{overflow:auto}.app{height:auto;min-height:100dvh;display:block}.topbar{height:58px;padding:0 10px;position:sticky;top:0;z-index:20}.brand{min-width:0}.brand img{width:34px;height:32px}.brand strong{font-size:18px}.divider,.back{display:none}.export{padding:9px 14px;font-size:12px}.workspace{display:flex;flex-direction:column;overflow:visible}.tools{order:2;border-right:0;border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:row;overflow-x:auto;gap:3px}.tool{min-width:64px;padding:7px 4px}.tool .ico{font-size:18px}.stage{order:1;padding:9px;min-height:0}.compare{grid-template-columns:1fr 1fr;gap:7px}.pane{aspect-ratio:4/5;height:auto}.pane-label{top:7px;left:7px;font-size:10px;padding:5px 7px}.panel{order:3;max-height:none;padding:15px}.film{padding:8px 9px;position:sticky;bottom:0;z-index:15}.thumb,.add{width:66px;height:58px;flex-basis:66px}.topbar .icon-btn{display:none}}
@media(max-width:380px){.compare{grid-template-columns:1fr}.tools{gap:0}.tool{min-width:58px}.tool span:last-child{font-size:9px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><img src="assets/duskreel-logo.svg" alt="Duskreel"><strong>Duskreel</strong></div><div class="divider"></div><button class="back">← Editor</button><div class="top-spacer"></div><button class="icon-btn" title="Undo">↶</button><button class="icon-btn" title="Redo">↷</button><button class="export" id="exportBtn">⇩ Export</button></header>
<div class="workspace"><nav class="tools">
<button class="tool active"><span class="ico">☷</span><span>Adjust</span></button><button class="tool"><span class="ico">⌗</span><span>Crop</span></button><button class="tool"><span class="ico">✦</span><span>AI Tools</span></button><button class="tool"><span class="ico">✧</span><span>Effects</span></button><button class="tool"><span class="ico">◉</span><span>Retouch</span></button><button class="tool"><span class="ico">⌁</span><span>Brush</span></button><button class="tool"><span class="ico">T</span><span>Text</span></button><button class="tool"><span class="ico">☺</span><span>Stickers</span></button>
</nav>
<main class="stage"><div class="compare"><section class="pane"><span class="pane-label">Before</span><img id="before" class="photo" alt="Before"></section><section class="pane"><span class="pane-label">After</span><img id="after" class="photo" alt="After"><span id="afterEmpty" class="empty"><b>Your edited photo</b>Upload a photo to start</span></section></div><div class="stagebar"><button class="zoom">−</button><span class="zoom" id="zoom">100%</span><button class="zoom">+</button><button class="zoom">Fit</button></div></main>
<aside class="panel"><h2>Watermark Logo</h2><div class="section"><div class="upload" id="uploadBox"><img id="logoPreview" src="assets/duskreel-logo.svg" alt="Default logo"><div class="upload-title">Upload your logo</div><div class="upload-sub">PNG, JPG, WebP or SVG</div></div><input class="hidden" id="logoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="row"><span>Default logo</span><span class="val">6%</span></div><button class="remove" id="removeBtn">Remove logo</button></div><div class="section"><div class="row"><label>Opacity</label><span class="val" id="opacityVal">70%</span></div><input id="opacity" type="range" min="0" max="100" value="70"><div class="row"><label>Size</label><span class="val" id="sizeVal">6%</span></div><input id="size" type="range" min="2" max="30" value="6"><div class="row"><label>Position</label></div><div class="positions" id="positions"></div><p style="font-size:10px;line-height:1.5;color:#777;margin-top:12px">Your logo appears on the edited image and is included when you export.</p></div><div class="section"><div class="row"><label>Exposure</label><span class="val" id="expVal">0</span></div><input type="range" id="exposure" min="-100" max="100" value="0"></div></aside></div>
<div class="film"><button class="add" id="addBtn">＋</button><div id="thumbs" style="display:flex;gap:10px"></div></div></div>
<script>
const $=s=>document.querySelector(s);let logoSrc='assets/duskreel-logo.svg',removed=false,opacity=70,size=6,pos='br',photoSrc='';
const posNames=['tl','tc','tr','cl','cc','cr','bl','bc','br'];const posGrid=$('#positions');posNames.forEach(p=>{const b=document.createElement('button');b.className='pos'+(p===pos?' active':'');b.onclick=()=>{pos=p;document.querySelectorAll('.pos').forEach(x=>x.classList.remove('active'));b.classList.add('active')};posGrid.appendChild(b)});
function render(){const after=$('#after'),before=$('#before');after.style.display=photoSrc?'block':'none';before.style.display=photoSrc?'block':'none';$('#afterEmpty').style.display=photoSrc?'none':'block';if(photoSrc){before.src=photoSrc;after.src=photoSrc;after.style.filter=`brightness(${100+Number($('#exposure').value)/2}%)`;}}
$('#uploadBox').onclick=()=>$('#logoInput').click();$('#logoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logoSrc=r.result;removed=false;$('#logoPreview').src=logoSrc;render()};r.readAsDataURL(f)};$('#removeBtn').onclick=()=>{removed=true;$('#logoPreview').style.opacity='.18'};$('#opacity').oninput=e=>{$('#opacityVal').textContent=e.target.value+'%';opacity=e.target.value};$('#size').oninput=e=>{$('#sizeVal').textContent=e.target.value+'%';size=e.target.value};$('#exposure').oninput=render;
function addFiles(files){const f=files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoSrc=r.result;const im=document.createElement('img');im.src=photoSrc;const d=document.createElement('button');d.className='thumb active';d.appendChild(im);d.onclick=()=>{document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));d.classList.add('active');render()};$('#thumbs').appendChild(d);render()};r.readAsDataURL(f)}
const file=document.createElement('input');file.type='file';file.accept='image/*';file.onchange=e=>addFiles(e.target.files);$('#addBtn').onclick=()=>file.click();$('#exportBtn').onclick=()=>{if(!photoSrc){alert('Upload a photo first.');return}const a=document.createElement('a');a.href=photoSrc;a.download='duskreel-edit.jpg';a.click()};render();
</script></body></html>
