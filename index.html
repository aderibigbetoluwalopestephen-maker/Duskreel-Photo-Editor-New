<script>

const defaultWatermarkLogo=new Image();

const DEFAULT={exposure:0,contrast:0,saturation:0,warmth:0,brightness:0,sharpness:0,effect:'none',crop:null,blur:0,noise:0,noiseCleaned:false,text:'',textSize:45,textColor:'#ffffff',textOpacity:100,textX:8,textY:14,textFont:'Arial',textAlign:'left',textShadow:70,sticker:'',brush:[],frame:'none',clean:0,faceClean:0,bgRemove:false,bgTolerance:32,bgReplace:'none',bgColor:'#111111'};

$('.undo').onclick=undo;$('.redo').onclick=redo;

  reader.onload=function(){
    const src=reader.result;
    const im=new Image();
    im.onload=function(){
      if(!im.naturalWidth||!im.naturalHeight){toast('Could not load this picture');return}
      // Show the selected picture immediately, before any editor code runs.
      const beforePreview=$('#beforeImage'),afterPreview=$('#afterImage');
      if(beforePreview&&afterPreview){
        beforePreview.src=src;
        afterPreview.src=src;
        beforePreview.style.display='block';
        afterPreview.style.display='block';
        $('#beforeEmpty').style.display='none';
        $('#afterEmpty').style.display='none';
      }
      const item={id:Date.now()+Math.random(),name:file.name||'photo',img:im,edit:cloneEdit(DEFAULT)};
      S.photos.push(item);
      S.active=S.photos.length-1;
      S.history=[];S.future=[];
      try{renderThumbs()}catch(err){console.error('Duskreel thumbnails:',err)}
      try{render()}catch(err){console.error('Duskreel render:',err)}
      try{renderPanel()}catch(err){console.error('Duskreel panel:',err)}

    };
    im.onerror=function(){toast('This picture cannot be displayed. Try JPG or PNG.')};
    im.src=src;

const fileInput=$('#duskreelFileInput');
if(fileInput){
  const handleFiles=e=>{
    const files=Array.from(e.target.files||[]);
    if(files.length)files.forEach(addPhoto);
    e.target.value='';
  };
  fileInput.addEventListener('change',handleFiles);
  fileInput.addEventListener('input',handleFiles);
}
function fitRect(w,h,boxw,boxh){const k=Math.min(boxw/w,boxh/h);return [Math.max(1,w*k),Math.max(1,h*k)]}

function drawCanvas(canvas,img,e,includeLogo,outputW=null,outputH=null){const maxW=outputW||Math.max(240,canvas.parentElement.clientWidth-2),maxH=outputH||Math.max(220,canvas.parentElement.clientHeight-2);let srcW=img.naturalWidth||img.width,srcH=img.naturalHeight||img.height;let sx=0,sy=0,sw=srcW,sh=srcH;if(e.autoCrop){sx=srcW*e.autoCrop.x;sy=srcH*e.autoCrop.y;sw=srcW*e.autoCrop.w;sh=srcH*e.autoCrop.h}else if(e.crop){const r=e.crop.w/e.crop.h,cur=sw/sh;if(cur>r){sw=sh*r;sx=(srcW-sw)/2}else{sh=sw/r;sy=(srcH-sh)/2}}let dw,dh;if(outputW&&outputH){const target=outputW/outputH,cur=sw/sh;if(cur>target){const nw=sh*target;sx+=(sw-nw)/2;sw=nw}else if(cur<target){const nh=sw/target;sy+=(sh-nh)/2;sh=nh}dw=outputW;dh=outputH}else{[dw,dh]=fitRect(sw,sh,maxW,maxH)}canvas.width=Math.round(dw);canvas.height=Math.round(dh);const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.filter=filterString(e);ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);ctx.restore();
if(e.clean>0||e.faceClean>0||e.bgRemove){
try{
const id=ctx.getImageData(0,0,canvas.width,canvas.height),d=id.data,w=canvas.width,h=canvas.height,original=new Uint8ClampedArray(d),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
if(e.clean>0){const amt=Math.min(1,e.clean/100);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;if(original[i+3]<10)continue;const lum=(original[i]+original[i+1]+original[i+2])/3;let nr=0,ng=0,nb=0,n=0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const j=((y+oy)*w+(x+ox))*4;nr+=original[j];ng+=original[j+1];nb+=original[j+2];n++}const avg=(nr+ng+nb)/(n*3);if(Math.abs(lum-avg)<34){d[i]=clamp(original[i]*(1-amt)+nr/n*amt,0,255);d[i+1]=clamp(original[i+1]*(1-amt)+ng/n*amt,0,255);d[i+2]=clamp(original[i+2]*(1-amt)+nb/n*amt,0,255)}}}
if(e.faceClean>0){const amt=Math.min(.85,e.faceClean/100);for(let y=2;y<h-2;y+=2)for(let x=2;x<w-2;x+=2){const i=(y*w+x)*4,r=original[i],g=original[i+1],b=original[i+2],skin=r>70&&g>35&&b>20&&r>g*1.12&&g>b*1.05&&(r-b)>25;if(!skin||original[i+3]<20)continue;let ar=0,ag=0,ab=0,n=0;for(let oy=-2;oy<=2;oy+=2)for(let ox=-2;ox<=2;ox+=2){if(!ox&&!oy)continue;const j=((y+oy)*w+(x+ox))*4;ar+=original[j];ag+=original[j+1];ab+=original[j+2];n++}const lum=(r+g+b)/3,avg=(ar+ag+ab)/(n*3);if(lum<avg-10){d[i]=clamp(r+(ar/n-r)*amt,0,255);d[i+1]=clamp(g+(ag/n-g)*amt,0,255);d[i+2]=clamp(b+(ab/n-b)*amt,0,255)}}}
if(e.bgRemove){const samples=[];for(const pair of [[2,2],[w-3,2],[2,h-3],[w-3,h-3]]){const sx=pair[0],sy=pair[1],j=(Math.max(0,Math.min(h-1,sy))*w+Math.max(0,Math.min(w-1,sx)))*4;samples.push([original[j],original[j+1],original[j+2]])}const bg=samples.reduce((a,v)=>[a[0]+v[0]/samples.length,a[1]+v[1]/samples.length,a[2]+v[2]/samples.length],[0,0,0]),tol=Math.max(8,Number(e.bgTolerance)||32),seen=new Uint8Array(w*h),stack=[],near=idx=>{const dr=original[idx]-bg[0],dg=original[idx+1]-bg[1],db=original[idx+2]-bg[2];return Math.sqrt(dr*dr+dg*dg+db*db)<=tol};for(let x=0;x<w;x++){stack.push(x);stack.push((h-1)*w+x)}for(let y=0;y<h;y++){stack.push(y*w);stack.push(y*w+w-1)}while(stack.length){const p=stack.pop();if(p<0||p>=w*h||seen[p]||!near(p*4))continue;seen[p]=1;d[p*4+3]=0;const x=p%w,y=(p/w)|0;if(x>0)stack.push(p-1);if(x<w-1)stack.push(p+1);if(y>0)stack.push(p-w);if(y<h-1)stack.push(p+w)}ctx.clearRect(0,0,w,h);if(e.bgReplace==='color'){ctx.fillStyle=e.bgColor||'#111111';ctx.fillRect(0,0,w,h)}else if(e.bgReplace==='image'&&S.bgImage){const bw=S.bgImage.naturalWidth||S.bgImage.width,bh=S.bgImage.naturalHeight||S.bgImage.height,k=Math.max(w/bw,h/bh),dw=bw*k,dh=bh*k;ctx.drawImage(S.bgImage,(w-dw)/2,(h-dh)/2,dw,dh)}ctx.putImageData(id,0,0)}

}

  const dx=(e.clientX-cropDrag.sx)/r.width,dy=(e.clientY-cropDrag.sy)/r.height,q=cropDrag.start,m=cropDrag.mode;
  let x=q.x,y=q.y,w=q.w,h=q.h;
  if(m==='move'){
    x=Math.max(0,Math.min(1-w,q.x+dx));y=Math.max(0,Math.min(1-h,q.y+dy));
  }else{
    if(m.includes('w')){x=Math.max(0,Math.min(q.x+q.w-.02,q.x+dx));w=q.x+q.w-x}
    if(m.includes('e'))w=Math.max(.02,Math.min(1-x,q.w+dx));
    if(m.includes('n')){y=Math.max(0,Math.min(q.y+q.h-.02,q.y+dy));h=q.y+q.h-y}
    if(m.includes('s'))h=Math.max(.02,Math.min(1-y,q.h+dy));
    if(cropDrag.ratio){
      const ratio=cropDrag.ratio;
      if(m.includes('e')||m.includes('w')){
        h=Math.min(1-y,Math.max(.02,w/ratio));w=h*ratio;
        if(m.includes('w'))x=q.x+q.w-w;
      }else{
        w=Math.min(1-x,Math.max(.02,h*ratio));h=w/ratio;
        if(m.includes('n'))y=q.y+q.h-h;
      }
    }
  }
  photo().edit.autoCrop=clampCrop({x,y,w,h},cropDrag.ratio);
  render();
  updateCropOverlay();
},{passive:false});
function endCropDrag(e){
  if(!cropDrag)return;
  if(e&&e.pointerId!=null&&e.pointerId!==cropDrag.pointerId)return;
  cropDrag=null;
}
window.addEventListener('pointerup',endCropDrag);
window.addEventListener('pointercancel',endCropDrag);
function selectTool(tab){S.tab=tab;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));renderPanel();if(window.innerWidth<=950)setTimeout(()=>document.querySelector('#panel')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}
const toolNav=document.querySelector('.tools');
if(toolNav){toolNav.addEventListener('click',e=>{const b=e.target.closest('.tool');if(b)selectTool(b.dataset.tab)});toolNav.addEventListener('touchend',e=>{const b=e.target.closest('.tool');if(b){e.preventDefault();selectTool(b.dataset.tab)}},{passive:false});}
$('#reset').onclick=()=>{if(!photo())return;snapshot();photo().edit=cloneEdit(DEFAULT);S.logoRemoved=false;S.wm={size:6,opacity:70,pos:'br'};renderPanel();render();toast('Reset complete')};
$('#zoomIn').onclick=()=>{S.zoom=Math.min(2,S.zoom+.1);render()};$('#zoomOut').onclick=()=>{S.zoom=Math.max(.5,S.zoom-.1);render()};$('#fit').onclick=()=>{S.zoom=1;render()};
let drawing=false,last=null;$('#after').addEventListener('pointerdown',e=>{if(S.tab!=='brush'||!photo())return;snapshot();drawing=true;last=point(e)});$('#after').addEventListener('pointermove',e=>{if(!drawing||!last||!photo())return;const n=point(e);photo().edit.brush.push({x1:last.x,y1:last.y,x2:n.x,y2:n.y});last=n;render()});window.addEventListener('pointerup',()=>{if(drawing){drawing=false}});
function point(e){const r=$('#after').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function exportDimensions(){const p=photo();let w=p.img.naturalWidth||p.img.width,h=p.img.naturalHeight||p.img.height;const s=$('#exportSize').value;if(s==='4k'||s==='2k'||s==='large'||s==='medium'||s==='small'){const target=s==='4k'?3840:s==='2k'?2560:s==='large'?2000:s==='medium'?1500:1000;const k=target/Math.max(w,h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k))}else if(s==='square'){w=h=1080}return{w,h}}
function previewCanvasSize(canvas,w,h){const box=canvas.parentElement;const bw=Math.max(80,box.clientWidth-2),bh=150;const k=Math.min(bw/w,bh/h);canvas.width=Math.max(1,Math.round(w*k));canvas.height=Math.max(1,Math.round(h*k))}
function drawExportPreview(){const p=photo();if(!p)return;const d=exportDimensions();$('#exportResolution').textContent=d.w+' × '+d.h+' px';const oc=$('#exportOriginalPreview'),ec=$('#exportEditedPreview');previewCanvasSize(oc,d.w,d.h);previewCanvasSize(ec,d.w,d.h);drawCanvas(oc,p.img,DEFAULT,false);drawCanvas(ec,p.img,p.edit,true)}
function openExport(){if(!photo()){toast('Upload a photo first');return}$('#exportModal').classList.add('show');updateExportResolution()}
function updateExportResolution(){drawExportPreview()}
$('#export').onclick=openExport;$('#cancelExport').onclick=()=>$('#exportModal').classList.remove('show');$('#exportQuality').oninput=e=>$('#qualityVal').textContent=e.target.value+'%';$('#exportSize').onchange=updateExportResolution;$('#exportFormat').onchange=()=>{$('#exportQuality').disabled=$('#exportFormat').value==='image/png';$('#qualityVal').textContent=$('#exportFormat').value==='image/png'?'Lossless':$('#exportQuality').value+'%';drawExportPreview()};
$('#downloadExport').onclick=()=>{try{const p=photo();if(!p)return;const d=exportDimensions();const out=document.createElement('canvas');out.width=d.w;out.height=d.h;drawCanvas(out,p.img,p.edit,true,d.w,d.h);const type=$('#exportFormat').value,q=type==='image/png'?1:+$('#exportQuality').value/100;const ext=type==='image/png'?'png':type==='image/webp'?'webp':'jpg';out.toBlob(blob=>{if(!blob){toast('Export failed — try another format');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(p.name.replace(/\\.[^.]+$/,'')||'duskreel')+'-edited.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#exportModal').classList.remove('show');toast('Exported '+d.w+' × '+d.h+' '+ext.toUpperCase())},type,q)}catch(err){console.error(err);toast('Export failed — please try again')}};
renderPanel();render();
window.addEventListener('error',e=>{console.error('Duskreel error:',e.error||e.message)});
</script></body></html>
