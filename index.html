<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Duskreel Photo Editor</title>
<style>
:root{--bg:#030303;--panel:#090909;--panel2:#101010;--line:#242424;--gold:#ffd21c;--gold2:#ffae00;--gold3:#fff27a;--text:#f4f4f4;--muted:#8d8d8d;--red:#ff5959}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;height:100%;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100dvh;display:grid;grid-template-rows:62px minmax(0,1fr) 94px}.top{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#050505}.brand{display:flex;align-items:center;gap:9px}.brand img{width:42px;height:38px;object-fit:contain}.brand b{font-size:20px}.sep{height:25px;width:1px;background:var(--line)}.top-spacer{flex:1}.top button{background:#101010;border:1px solid var(--line);border-radius:8px;padding:9px 12px}.top .export{background:linear-gradient(135deg,var(--gold3),var(--gold2));color:#111;border:0;font-weight:800;padding:10px 20px}.workspace{min-height:0;display:grid;grid-template-columns:88px minmax(0,1fr) 315px}.tools{border-right:1px solid var(--line);background:#070707;padding:9px 7px;display:flex;flex-direction:column;gap:4px;overflow:auto}.tool{border:0;background:transparent;border-radius:9px;padding:9px 3px;color:#999;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}.tool .ico{font-size:19px}.tool.active{background:#171717;color:#fff;box-shadow:inset 3px 0 var(--gold)}.tool.active .ico{color:var(--gold)}
.stage{min-width:0;min-height:0;padding:14px;background:#080808;display:flex;flex-direction:column;gap:9px}.compare{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.pane{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:9px;background:#050505;display:flex;align-items:center;justify-content:center}.pane canvas{max-width:100%;max-height:100%;object-fit:contain}.label{position:absolute;z-index:3;left:10px;top:10px;background:#171717e8;border-radius:6px;padding:6px 9px;font-size:11px;font-weight:700}.empty{text-align:center;color:#666}.empty b{display:block;color:#aaa;margin-bottom:5px}.stagebar{display:flex;justify-content:center;gap:5px}.stagebar button{background:#111;border:1px solid var(--line);border-radius:7px;padding:6px 12px;color:#aaa}.panel{border-left:1px solid var(--line);background:#080808;padding:16px;overflow:auto}.panel h2{font-size:16px;margin:0 0 12px}.section{border-top:1px solid var(--line);padding:13px 0}.section:first-of-type{border-top:0;padding-top:0}.row{display:flex;justify-content:space-between;align-items:center;margin:9px 0 5px;font-size:11px;color:#bbb}.val{color:#fff}.panel input[type=range]{width:100%;accent-color:var(--gold)}.select{width:100%;background:#111;color:#eee;border:1px solid var(--line);border-radius:7px;padding:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.mini{background:#111;border:1px solid #292929;border-radius:7px;padding:8px 4px;font-size:10px}.mini.active{border-color:var(--gold);color:var(--gold)}.upload{border:1px dashed #444;border-radius:9px;padding:12px;text-align:center;background:#0d0d0d}.upload:hover{border-color:var(--gold)}.upload img{width:54px;height:42px;object-fit:contain}.hidden{display:none}.danger{border-color:#3b2020!important;color:#ff8a8a!important}.hint{font-size:9px;color:#707070;line-height:1.45}.film{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:9px 14px;border-top:1px solid var(--line);background:#070707}.add,.thumb{width:75px;height:70px;flex:0 0 75px;border-radius:8px}.add{border:1px dashed #444;background:#101010;font-size:25px;color:#aaa}.thumb{padding:0;border:1px solid #292929;background:#111;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{border:2px solid var(--gold)}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#171717;border:1px solid #333;padding:9px 14px;border-radius:8px;font-size:11px;z-index:50;display:none}
@media(max-width:950px){.workspace{grid-template-columns:74px minmax(0,1fr)}.panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:290px}.workspace{overflow:auto}.stage{min-height:55vh}}
@media(max-width:700px){html,body{overflow:auto}.app{display:block;height:auto;min-height:100dvh}.top{height:56px;padding:0 9px;position:sticky;top:0;z-index:30}.brand img{width:34px;height:32px}.brand b{font-size:17px}.sep,.top .undo,.top .redo{display:none}.top .export{padding:8px 12px;font-size:11px}.workspace{display:flex;flex-direction:column;overflow:visible}.stage{order:1;padding:8px;min-height:0}.compare{grid-template-columns:1fr 1fr;gap:6px}.pane{aspect-ratio:4/5}.label{left:6px;top:6px;padding:4px 6px;font-size:9px}.tools{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;overflow-x:auto}.tool{min-width:58px;padding:6px 2px}.tool .ico{font-size:17px}.panel{order:3;max-height:none;padding:13px}.film{position:sticky;bottom:0;z-index:25;padding:7px 8px}.thumb,.add{width:62px;height:56px;flex-basis:62px}}@media(max-width:370px){.compare{grid-template-columns:1fr}.pane{aspect-ratio:4/3}}
 .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100}.modal.show{display:flex}.exportbox{width:min(430px,92vw);background:#0d0d0d;border:1px solid #333;border-radius:14px;padding:20px;box-shadow:0 20px 70px #000}.exportbox h2{margin:0 0 5px;font-size:18px}.exportbox .sub{color:#888;font-size:11px;margin-bottom:16px}.exportrow{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:12px}.exportrow select,.exportrow input{background:#151515;color:#fff;border:1px solid #333;border-radius:7px;padding:8px}.exportrow input[type=range]{width:190px;accent-color:var(--gold);padding:0}.export-actions{display:flex;gap:8px;margin-top:18px}.export-actions button{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#151515}.export-actions .download{background:linear-gradient(135deg,var(--gold3),var(--gold2));color:#111;border:0;font-weight:800}</style></head>
<body><div class="app">
<header class="top"><div class="brand"><img src="assets/duskreel-logo.svg"><b>Duskreel</b></div><div class="sep"></div><button class="undo">↶ Undo</button><button class="redo">↷ Redo</button><div class="top-spacer"></div><button id="reset">Reset</button><button class="export" id="export">⇩ Export</button></header>
<div class="workspace"><nav class="tools">
<button class="tool active" data-tab="adjust"><span class="ico">☷</span>Adjust</button><button class="tool" data-tab="crop"><span class="ico">⌗</span>Crop</button><button class="tool" data-tab="ai"><span class="ico">✦</span>AI Tools</button><button class="tool" data-tab="effects"><span class="ico">✧</span>Effects</button><button class="tool" data-tab="retouch"><span class="ico">◉</span>Retouch</button><button class="tool" data-tab="brush"><span class="ico">⌁</span>Brush</button><button class="tool" data-tab="text"><span class="ico">T</span>Text</button><button class="tool" data-tab="stickers"><span class="ico">☺</span>Stickers</button><button class="tool" data-tab="watermark"><span class="ico">◇</span>Logo</button>
</nav>
<main class="stage"><div class="compare"><section class="pane"><span class="label">Before</span><canvas id="before"></canvas><div id="beforeEmpty" class="empty"><b>Before</b>Upload a photo below</div></section><section class="pane"><span class="label">After</span><canvas id="after"></canvas><div id="afterEmpty" class="empty"><b>Your edited photo</b>Upload a photo below</div></section></div><div class="stagebar"><button id="zoomOut">−</button><button id="zoomText">100%</button><button id="zoomIn">＋</button><button id="fit">Fit</button></div></main>
<aside class="panel" id="panel"></aside></div>
<footer class="film"><button class="add" id="add">＋</button><div id="thumbs" style="display:flex;gap:8px"></div></footer></div><div id="toast" class="toast"></div><div id="exportModal" class="modal"><div class="exportbox"><h2>Export photo</h2><div class="sub">Choose the output size, format and quality before downloading.</div><div class="exportrow"><label>Size</label><select id="exportSize"><option value="original">Original size</option><option value="large">Large — 2000px</option><option value="medium">Medium — 1500px</option><option value="small">Small — 1000px</option><option value="square">Square — 1080×1080</option></select></div><div class="exportrow"><label>Format</label><select id="exportFormat"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div class="exportrow"><label>Quality <span id="qualityVal">90%</span></label><input id="exportQuality" type="range" min="10" max="100" value="90"></div><div class="exportrow"><label>Resolution</label><span id="exportResolution" style="color:#aaa">Original</span></div><div class="export-actions"><button id="cancelExport">Cancel</button><button class="download" id="downloadExport">Export photo</button></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const S={photos:[],active:-1,tab:'adjust',zoom:1,logo:null,logoName:'Duskreel default',logoRemoved:false,wm:{size:6,opacity:70,pos:'br'},history:[],future:[]};
const DEFAULT={exposure:0,contrast:0,saturation:0,warmth:0,brightness:0,sharpness:0,effect:'none',crop:null,blur:0,noise:0,text:'',textSize:45,textColor:'#ffffff',textOpacity:100,textX:8,textY:14,textFont:'Arial',textAlign:'left',textShadow:70,sticker:'',brush:[]};
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',1500)}
function photo(){return S.photos[S.active]}
function cloneEdit(e){return JSON.parse(JSON.stringify(e))}
function snapshot(){if(!photo())return;S.history.push({edit:cloneEdit(photo().edit),logoRemoved:S.logoRemoved,wm:{...S.wm}});if(S.history.length>30)S.history.shift();S.future=[]}
function restore(s){if(!photo())return;photo().edit=cloneEdit(s.edit);S.logoRemoved=s.logoRemoved;S.wm={...s.wm};render();renderPanel()}
function undo(){if(!S.history.length)return;S.future.push({edit:cloneEdit(photo().edit),logoRemoved:S.logoRemoved,wm:{...S.wm}});restore(S.history.pop())}
function redo(){if(!S.future.length)return;S.history.push({edit:cloneEdit(photo().edit),logoRemoved:S.logoRemoved,wm:{...S.wm}});restore(S.future.pop())}
$('.undo').onclick=undo;$('.redo').onclick=redo;
function addPhoto(file){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{S.photos.push({id:Date.now()+Math.random(),name:file.name,img:im,edit:cloneEdit(DEFAULT)});S.active=S.photos.length-1;S.history=[];S.future=[];renderThumbs();render();renderPanel();toast('Photo added')};im.src=r.result};r.readAsDataURL(file)}
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';fileInput.multiple=true;fileInput.onchange=e=>[...e.target.files].forEach(addPhoto);$('#add').onclick=()=>fileInput.click();
function fitRect(w,h,boxw,boxh){const k=Math.min(boxw/w,boxh/h);return [Math.max(1,w*k),Math.max(1,h*k)]}
function filterString(e){const b=1+e.brightness/100+e.exposure/180,c=1+e.contrast/100,s=1+e.saturation/100;let f=`brightness(${b}) contrast(${c}) saturate(${s})`;const ef={grayscale:' grayscale(1)',sepia:' sepia(.75)',vintage:' sepia(.22) contrast(1.08) saturate(.78)',mono:' grayscale(1) contrast(1.15)',cinematic:' contrast(1.22) saturate(.86)',warm:' sepia(.16) saturate(1.25) brightness(1.03)',cool:' saturate(.9) hue-rotate(12deg) brightness(1.03)',dramatic:' contrast(1.38) saturate(.9)',faded:' contrast(.9) saturate(.78) brightness(1.06)',vivid:' contrast(1.12) saturate(1.45)',dream:' brightness(1.08) saturate(1.15) contrast(.94)',noir:' grayscale(1) contrast(1.42) brightness(.92)',sunset:' sepia(.28) saturate(1.42) contrast(1.06)',negative:' invert(1) contrast(1.08)'};f+=ef[e.effect]||'';if(e.blur)f+=' blur('+e.blur+'px)';return f}
function drawCanvas(canvas,img,e,includeLogo){const maxW=Math.max(240,canvas.parentElement.clientWidth-2),maxH=Math.max(220,canvas.parentElement.clientHeight-2);let srcW=img.naturalWidth||img.width,srcH=img.naturalHeight||img.height;let sx=0,sy=0,sw=srcW,sh=srcH;if(e.crop){const r=e.crop.w/e.crop.h,cur=sw/sh;if(cur>r){sw=sh*r;sx=(srcW-sw)/2}else{sh=sw/r;sy=(srcH-sh)/2}}const [dw,dh]=fitRect(sw,sh,maxW,maxH);canvas.width=Math.round(dw);canvas.height=Math.round(dh);const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.filter=filterString(e);ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);ctx.restore();
if(e.warmth){ctx.save();ctx.globalAlpha=Math.min(.35,Math.abs(e.warmth)/300);ctx.fillStyle=e.warmth>0?'#ff9b43':'#5b8dff';ctx.globalCompositeOperation=e.warmth>0?'soft-light':'overlay';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore()}
if(e.sharpness>0){ctx.save();ctx.globalAlpha=e.sharpness/180;ctx.globalCompositeOperation='overlay';ctx.filter='contrast(1.18)';ctx.drawImage(canvas,0,0);ctx.restore()}
if(e.noise>0){ctx.save();ctx.globalAlpha=e.noise/500;for(let i=0;i<canvas.width*canvas.height/120;i++){ctx.fillStyle=Math.random()>.5?'#fff':'#000';ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,1,1)}ctx.restore()}
if(e.brush?.length){ctx.save();ctx.strokeStyle='#ffd21c';ctx.lineWidth=4;ctx.lineCap='round';for(const p of e.brush){ctx.beginPath();ctx.moveTo(p.x1*canvas.width,p.y1*canvas.height);ctx.lineTo(p.x2*canvas.width,p.y2*canvas.height);ctx.stroke()}ctx.restore()}
if(e.text){ctx.save();const fs=Math.max(10,canvas.width*e.textSize/1000);ctx.font='bold '+fs+'px '+e.textFont;ctx.fillStyle=e.textColor||'#fff';ctx.globalAlpha=(e.textOpacity??100)/100;ctx.textAlign=e.textAlign||'left';ctx.shadowColor='#000';ctx.shadowBlur=(e.textShadow??70)/10;ctx.fillText(e.text,canvas.width*(e.textX??8)/100,canvas.height*(e.textY??14)/100);ctx.restore()}
if(e.sticker){ctx.save();ctx.font=Math.max(28,canvas.width*.12)+'px Arial';ctx.fillText(e.sticker,canvas.width*.78,canvas.height*.18);ctx.restore()}
if(includeLogo&&!S.logoRemoved&&S.logo){const w=canvas.width*S.wm.size/100,h=w*((S.logo.height||1)/(S.logo.width||1)),pad=canvas.width*.025;let x=canvas.width-w-pad,y=canvas.height-h-pad;if(S.wm.pos.includes('l'))x=pad;if(S.wm.pos.includes('c'))x=(canvas.width-w)/2;if(S.wm.pos.includes('t'))y=pad;if(S.wm.pos[0]==='c')y=(canvas.height-h)/2;ctx.save();ctx.globalAlpha=S.wm.opacity/100;ctx.drawImage(S.logo,x,y,w,h);ctx.restore()}
}
function render(){const p=photo(),b=$('#before'),a=$('#after');if(!p){b.style.display=a.style.display='none';$('#beforeEmpty').style.display=$('#afterEmpty').style.display='block';return}$('#beforeEmpty').style.display=$('#afterEmpty').style.display='none';b.style.display=a.style.display='block';drawCanvas(b,p.img,DEFAULT,false);drawCanvas(a,p.img,p.edit,true);a.style.transform='scale('+S.zoom+')';$('#zoomText').textContent=Math.round(S.zoom*100)+'%'}
function renderThumbs(){$('#thumbs').innerHTML='';S.photos.forEach((p,i)=>{const b=document.createElement('button');b.className='thumb'+(i===S.active?' active':'');const im=document.createElement('img');im.src=p.img.src;b.appendChild(im);b.title=p.name;b.onclick=()=>{S.active=i;S.history=[];S.future=[];renderThumbs();render();renderPanel()};$('#thumbs').appendChild(b)})}
function setEdit(key,val){if(!photo())return;snapshot();photo().edit[key]=val;render();renderPanel()}
const tabs={adjust:'Adjust',crop:'Crop',ai:'AI Tools',effects:'Effects',retouch:'Retouch',brush:'Brush',text:'Text',stickers:'Stickers',watermark:'Watermark Logo'};
function renderPanel(){const p=photo(),e=p?.edit;let h='<h2>'+tabs[S.tab]+'</h2>';if(!p){h+='<div class="hint">Upload a photo to unlock the editing tools.</div>';$('#panel').innerHTML=h;return}
if(S.tab==='adjust')h+=adjustHTML(e);if(S.tab==='crop')h+=cropHTML(e);if(S.tab==='ai')h+=aiHTML(e);if(S.tab==='effects')h+=effectsHTML(e);if(S.tab==='retouch')h+=retouchHTML(e);if(S.tab==='brush')h+=brushHTML();if(S.tab==='text')h+=textHTML(e);if(S.tab==='stickers')h+=stickersHTML();if(S.tab==='watermark')h+=watermarkHTML();$('#panel').innerHTML=h;bindPanel()}
function slider(id,label,key,min,max,step=1){return '<div class="row"><label>'+label+'</label><span class="val" id="'+id+'Val">'+(photo().edit[key])+'</span></div><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+photo().edit[key]+'">'}
function adjustHTML(e){return '<div class="section">'+slider('exp','Exposure','exposure',-100,100)+slider('con','Contrast','contrast',-100,100)+slider('sat','Saturation','saturation',-100,100)+slider('warm','Warmth','warmth',-100,100)+slider('sharp','Sharpness','sharpness',0,100)+'</div><div class="section"><button class="mini" id="resetAdjust">Reset adjustments</button></div>'}
function cropHTML(e){return '<div class="section"><div class="grid">'+['free','1:1','4:5','3:4','16:9','9:16'].map(x=>'<button class="mini '+((e.crop?.name||'free')===x?'active':'')+'" data-ratio="'+x+'">'+x+'</button>').join('')+'</div><button class="mini" id="applyCrop" style="margin-top:9px;width:100%">Apply crop</button><div class="hint" style="margin-top:9px">Choose a ratio; the crop is centered and applied to the edited photo.</div></div>'}
function aiHTML(){return '<div class="section"><button class="mini" id="clean" style="width:100%">✦ Clean & reduce noise</button><p class="hint">Applies noise reduction and clarity to the image locally in your browser.</p><button class="mini" id="enhance" style="width:100%;margin-top:6px">✦ Auto enhance</button></div>'}
function effectsHTML(e){return '<div class="section"><div class="grid">'+[['none','Original'],['vintage','Vintage'],['grayscale','B&W'],['sepia','Sepia'],['mono','Mono'],['cinematic','Cinematic'],['warm','Warm'],['cool','Cool'],['dramatic','Dramatic'],['faded','Faded'],['vivid','Vivid'],['dream','Dream'],['noir','Noir'],['sunset','Sunset'],['negative','Negative']].map(a=>'<button class="mini '+(e.effect===a[0]?'active':'')+'" data-effect="'+a[0]+'">'+a[1]+'</button>').join('')+'</div><p class="hint" style="margin-top:9px">Try different looks and combine them with Adjust controls.</p></div>'}
function retouchHTML(e){return '<div class="section">'+slider('blur','Soft blur','blur',0,5,0.5)+slider('noise','Texture','noise',0,100)+'<div class="hint">These controls provide a simple local retouch pass without uploading your photo.</div></div>'}
function brushHTML(){return '<div class="section"><button class="mini" id="clearBrush">Clear brush marks</button><p class="hint">Draw on the After preview with your finger or mouse. Gold strokes are included in export.</p></div>'}
function textHTML(e){return '<div class="section"><input id="textInput" class="select" maxlength="80" placeholder="Type text..." value="'+String(e.text||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"><button class="mini" id="applyText" style="margin-top:7px;width:100%">Add / Update text</button><div class="row"><label>Font</label></div><select id="textFont" class="select"><option>Arial</option><option>Georgia</option><option>Impact</option><option>Trebuchet MS</option><option>Courier New</option><option>Times New Roman</option></select>'+sliderText('textSize','Size',15,120,e.textSize??45,'px')+sliderText('textOpacity','Opacity',0,100,e.textOpacity??100,'%')+sliderText('textX','Horizontal',0,100,e.textX??8,'%')+sliderText('textY','Vertical',5,100,e.textY??14,'%')+sliderText('textShadow','Shadow',0,100,e.textShadow??70,'%')+'<div class="row"><label>Color</label></div><input id="textColor" type="color" value="'+(e.textColor||'#ffffff')+'" style="width:100%;height:38px;background:#111;border:1px solid #333;border-radius:7px"><div class="row"><label>Alignment</label></div><div class="grid"><button class="mini '+((e.textAlign||'left')==='left'?'active':'')+'" data-align="left">Left</button><button class="mini '+(e.textAlign==='center'?'active':'')+'" data-align="center">Center</button><button class="mini '+(e.textAlign==='right'?'active':'')+'" data-align="right">Right</button></div><button class="mini danger" id="clearText" style="margin-top:8px;width:100%">Remove text</button></div>'}
function sliderText(id,label,min,max,v,suffix){return '<div class="row"><label>'+label+'</label><span class="val" id="'+id+'Val">'+v+suffix+'</span></div><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" value="'+v+'">'}
function stickersHTML(){return '<div class="section"><div class="grid">'+['⭐','❤️','🔥','✨','☀️','🌙','✓','♥','★','🎉','🎨','📸','💫','💖','💎','👑','🌈','🌸','🌻','🍀','⚡','☁️','🦋','😎','🥳','💯','❣️','➤','✦','✧','☮️','♡','♛','☾','✿','❀'].map(x=>'<button class="mini sticker" data-sticker="'+x+'">'+x+'</button>').join('')+'</div><button class="mini danger" id="clearSticker" style="margin-top:7px;width:100%">Remove sticker</button><p class="hint" style="margin-top:8px">Choose a sticker to place it on the After preview.</p></div>'}
function watermarkHTML(){return '<div class="section"><div class="upload" id="logoUpload"><img id="logoPrev" src="'+(S.logo?S.logo.src:'assets/duskreel-logo.svg')+'"><div style="font-size:11px;font-weight:700;margin-top:5px">Upload your logo</div><div class="hint">PNG, JPG, WebP or SVG</div></div><input id="logoInput" class="hidden" type="file" accept="image/*"><div class="row"><span>Default size</span><span class="val">'+S.wm.size+'%</span></div>'+sliderWM('wmSize','Size',2,30,S.wm.size)+sliderWM('wmOpacity','Opacity',0,100,S.wm.opacity)+'<div class="row"><span>Position</span></div><div class="grid">'+['tl','tc','tr','cl','cc','cr','bl','bc','br'].map(x=>'<button class="mini '+(S.wm.pos===x?'active':'')+'" data-pos="'+x+'">'+x.toUpperCase()+'</button>').join('')+'</div><button class="mini danger" id="removeLogo" style="margin-top:8px;width:100%">'+(S.logoRemoved?'Restore default logo':'Remove logo')+'</button></div>'}
function sliderWM(id,label,min,max,v){return '<div class="row"><label>'+label+'</label><span class="val" id="'+id+'Val">'+v+'%</span></div><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" value="'+v+'">'}
function bindPanel(){const p=photo();if(!p)return;['exp','con','sat','warm','sharp','blur','noise'].forEach(id=>{const x=$('#'+id);if(x)x.oninput=()=>{p.edit[{exp:'exposure',con:'contrast',sat:'saturation',warm:'warmth',sharp:'sharpness',blur:'blur',noise:'noise'}[id]]=+x.value;$('#'+id+'Val').textContent=x.value;render()};if(x)x.onchange=()=>snapshot()});$('#resetAdjust')?.addEventListener('click',()=>{snapshot();Object.assign(p.edit,{exposure:0,contrast:0,saturation:0,warmth:0,sharpness:0,blur:0,noise:0});renderPanel();render()});
$$('[data-effect]').forEach(b=>b.onclick=()=>setEdit('effect',b.dataset.effect));$$('[data-ratio]').forEach(b=>b.onclick=()=>{const r=b.dataset.ratio;if(r==='free'){p.edit.crop=null}else{const [w,h]=r.split(':').map(Number);p.edit.crop={name:r,w,h}};renderPanel();render()});$('#applyCrop')?.addEventListener('click',()=>{if(p.edit.crop){snapshot();toast('Crop applied');render()}});$('#clean')?.addEventListener('click',()=>{snapshot();p.edit.noise=0;p.edit.sharpness=35;toast('Noise cleaned');renderPanel();render()});$('#enhance')?.addEventListener('click',()=>{snapshot();Object.assign(p.edit,{exposure:12,contrast:10,saturation:8,sharpness:22});toast('Auto enhanced');renderPanel();render()});$('#clearBrush')?.addEventListener('click',()=>{snapshot();p.edit.brush=[];render()});$('#applyText')?.addEventListener('click',()=>{snapshot();p.edit.text=$('#textInput').value.trim();render()});$('#clearText')?.addEventListener('click',()=>{snapshot();p.edit.text='';render()});const tf=$('#textFont');if(tf){tf.value=p.edit.textFont||'Arial';tf.onchange=()=>{snapshot();p.edit.textFont=tf.value;render()}}[['textSize','textSizeVal','px'],['textOpacity','textOpacityVal','%'],['textX','textXVal','%'],['textY','textYVal','%'],['textShadow','textShadowVal','%']].forEach(([id,val,suf])=>{const x=$('#'+id);if(x)x.oninput=()=>{p.edit[{textSize:'textSize',textOpacity:'textOpacity',textX:'textX',textY:'textY',textShadow:'textShadow'}[id]]=+x.value;$('#'+val).textContent=x.value+suf;render()};if(x)x.onchange=()=>snapshot()});const tc=$('#textColor');if(tc)tc.oninput=()=>{p.edit.textColor=tc.value;render()};if(tc)tc.onchange=()=>snapshot();$('[data-align]').forEach(b=>b.onclick=()=>{snapshot();p.edit.textAlign=b.dataset.align;renderPanel();render()});$$('.sticker').forEach(b=>b.onclick=()=>setEdit('sticker',b.dataset.sticker));$('#clearSticker')?.addEventListener('click',()=>{snapshot();p.edit.sticker='';render()});
$('#logoUpload')?.addEventListener('click',()=>$('#logoInput').click());$('#logoInput')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{S.logo=im;S.logoRemoved=false;S.wm.size=6;renderPanel();render();toast('Logo uploaded')};im.src=r.result};r.readAsDataURL(f)});$('#removeLogo')?.addEventListener('click',()=>{S.logoRemoved=!S.logoRemoved;renderPanel();render();toast(S.logoRemoved?'Logo removed':'Logo restored')});
$('#wmSize')?.addEventListener('input',e=>{S.wm.size=+e.target.value;$('#wmSizeVal').textContent=e.target.value+'%';render()});$('#wmOpacity')?.addEventListener('input',e=>{S.wm.opacity=+e.target.value;$('#wmOpacityVal').textContent=e.target.value+'%';render()});$$('[data-pos]').forEach(b=>b.onclick=()=>{S.wm.pos=b.dataset.pos;renderPanel();render()})}
$$('.tool').forEach(b=>b.onclick=()=>{$$('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.tab=b.dataset.tab;renderPanel()});
$('#reset').onclick=()=>{if(!photo())return;snapshot();photo().edit=cloneEdit(DEFAULT);S.logoRemoved=false;S.wm={size:6,opacity:70,pos:'br'};renderPanel();render();toast('Reset complete')};
$('#zoomIn').onclick=()=>{S.zoom=Math.min(2,S.zoom+.1);render()};$('#zoomOut').onclick=()=>{S.zoom=Math.max(.5,S.zoom-.1);render()};$('#fit').onclick=()=>{S.zoom=1;render()};
let drawing=false,last=null;$('#after').addEventListener('pointerdown',e=>{if(S.tab!=='brush'||!photo())return;drawing=true;last=point(e)});$('#after').addEventListener('pointermove',e=>{if(!drawing||!last||!photo())return;const n=point(e);photo().edit.brush.push({x1:last.x,y1:last.y,x2:n.x,y2:n.y});last=n;render()});window.addEventListener('pointerup',()=>{if(drawing){drawing=false;snapshot()}});
function point(e){const r=$('#after').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function openExport(){if(!photo()){toast('Upload a photo first');return}$('#exportModal').classList.add('show');updateExportResolution()}function updateExportResolution(){const p=photo();if(!p)return;const s=$('#exportSize').value;let w=p.img.naturalWidth||p.img.width,h=p.img.naturalHeight||p.img.height;if(s==='large'){const k=Math.min(1,2000/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}else if(s==='medium'){const k=Math.min(1,1500/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}else if(s==='small'){const k=Math.min(1,1000/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}else if(s==='square'){w=h=1080}$('#exportResolution').textContent=w+' × '+h+' px'}$('#export').onclick=openExport;$('#cancelExport').onclick=()=>$('#exportModal').classList.remove('show');$('#exportQuality').oninput=e=>$('#qualityVal').textContent=e.target.value+'%';$('#exportSize').onchange=updateExportResolution;$('#exportFormat').onchange=()=>{$('#exportQuality').disabled=$('#exportFormat').value==='image/png';$('#qualityVal').textContent=$('#exportFormat').value==='image/png'?'Lossless':$('#exportQuality').value+'%'};$('#downloadExport').onclick=()=>{const p=photo();if(!p)return;const s=$('#exportSize').value;let w=p.img.naturalWidth||p.img.width,h=p.img.naturalHeight||p.img.height;if(s==='large'){const k=Math.min(1,2000/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}else if(s==='medium'){const k=Math.min(1,1500/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}else if(s==='small'){const k=Math.min(1,1000/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}else if(s==='square'){w=h=1080}const out=document.createElement('canvas');out.width=w;out.height=h;const wrap=document.createElement('div');wrap.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px';const holder=document.createElement('div');holder.style.width=w+'px';holder.style.height=h+'px';wrap.appendChild(holder);document.body.appendChild(wrap);Object.defineProperty(out,'parentElement',{value:holder});drawCanvas(out,p.img,p.edit,true);wrap.remove();const type=$('#exportFormat').value,q=type==='image/png'?1:+$('#exportQuality').value/100;const ext=type==='image/png'?'png':type==='image/webp'?'webp':'jpg';const a=document.createElement('a');a.download=(p.name.replace(/\.[^.]+$/,'')||'duskreel')+'-edited.'+ext;a.href=out.toDataURL(type,q);a.click();$('#exportModal').classList.remove('show');toast('Exported '+w+' × '+h+' '+ext.toUpperCase())};
renderPanel();render(); 
</script></body></html>
